<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>10-3 视口与色彩 · 滕菲</title>
	<style>
		:root {
			font-size: 16px;
			color-scheme: light;
			--ink: #fff4e6;
			--soft-ink: rgba(255, 244, 230, 0.72);
			--rule: rgba(255, 244, 230, 0.25);
			--accent: #f0c45d;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.scene {
			position: relative;
			isolation: isolate;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			min-height: 100svh;
			overflow: hidden;
			padding: 2rem clamp(1.25rem, 5vw, 5rem);
			color: var(--ink);
			background-color: #bb503b;
			background-image: linear-gradient(115deg, transparent 0 67%, rgba(255, 241, 220, 0.07) 67.1%, transparent 67.2%), linear-gradient(rgba(255, 241, 220, 0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 241, 220, 0.055) 1px, transparent 1px);
			background-size: auto, 2rem 2rem, 2rem 2rem;
			transition: background-color 240ms ease, color 240ms ease;
		}

		.masthead,
		.footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
		}

		.masthead {
			min-height: 2.5rem;
			border-bottom: 1px solid var(--rule);
		}

		.brand,
		.edition,
		.footer {
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.12em;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 0.65rem;
		}

		.brand::before {
			width: 0.55rem;
			height: 0.55rem;
			background: var(--accent);
			content: "";
			transform: rotate(45deg);
		}

		.edition,
		.footer {
			color: var(--soft-ink);
		}

		.composition {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			align-items: center;
			gap: 2.5rem;
			flex: 1;
			width: min(100%, 78rem);
			margin: 0 auto;
			padding: 4rem 0;
		}

		.eyebrow {
			margin: 0 0 1.25rem;
			color: var(--accent);
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.16em;
		}

		h1 {
			max-width: 12em;
			margin: 0;
			font-size: 3.2rem;
			font-weight: 800;
			line-height: 1.2;
			letter-spacing: 0;
		}

		.description {
			max-width: 27rem;
			margin: 1.35rem 0 0;
			color: var(--soft-ink);
			font-size: 0.95rem;
			line-height: 1.9;
		}

		.credit {
			display: flex;
			align-items: baseline;
			gap: 1rem;
			width: fit-content;
			margin-top: 2.2rem;
			padding-top: 0.85rem;
			border-top: 1px solid var(--rule);
		}

		.credit span {
			color: var(--soft-ink);
			font-size: 0.68rem;
			letter-spacing: 0.12em;
		}

		.credit strong {
			font-size: 1rem;
			font-weight: 700;
		}

		.specimen {
			position: relative;
			display: grid;
			place-items: center;
			min-height: 15rem;
			border: 1px solid var(--rule);
		}

		.specimen::before,
		.specimen::after {
			position: absolute;
			content: "";
			pointer-events: none;
		}

		.specimen::before {
			inset: 0.65rem;
			border: 1px solid var(--rule);
		}

		.specimen::after {
			top: 50%;
			left: 0;
			width: 100%;
			border-top: 1px solid var(--rule);
		}

		.specimen-inner {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: baseline;
			gap: 0.4rem;
			padding: 0 1.25rem;
			background: #bb503b;
			transition: background-color 240ms ease;
		}

		.specimen-value {
			font-size: 5.8rem;
			font-weight: 800;
			line-height: 1;
			letter-spacing: -0.045em;
		}

		.specimen-unit {
			color: var(--accent);
			font-size: 1.2rem;
			font-weight: 700;
		}

		.specimen-label {
			position: absolute;
			bottom: 1.15rem;
			left: 1.25rem;
			color: var(--soft-ink);
			font-size: 0.64rem;
			letter-spacing: 0.14em;
		}

		.footer {
			min-height: 2.5rem;
			border-top: 1px solid var(--rule);
		}

		@media (max-width: 599px) {
			:root { font-size: 15px; }

			.scene {
				background-color: #bb503b;
			}

			.specimen-inner { background-color: #bb503b; }

			h1 { font-size: 2.7rem; }
			.specimen { min-height: 12rem; }
			.specimen-value { font-size: 4.6rem; }
			.edition { font-size: 0.6rem; }
		}

		@media (min-width: 600px) and (max-width: 899px) {
			:root {
				font-size: 16px;
				--ink: #29271e;
				--soft-ink: rgba(41, 39, 30, 0.68);
				--rule: rgba(41, 39, 30, 0.25);
				--accent: #8c3d2e;
			}

			.scene {
				color: var(--ink);
				background-color: #dfbd67;
				background-image: linear-gradient(115deg, transparent 0 67%, rgba(41, 39, 30, 0.045) 67.1%, transparent 67.2%), linear-gradient(rgba(41, 39, 30, 0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(41, 39, 30, 0.055) 1px, transparent 1px);
			}

			.specimen-inner { background-color: #dfbd67; }
		}

		@media (min-width: 900px) {
			:root { font-size: 18px; }

			.scene {
				background-color: #376c5d;
			}

			.specimen-inner { background-color: #376c5d; }

			.composition {
				grid-template-columns: minmax(0, 1.1fr) minmax(18rem, 0.9fr);
			}

			h1 { font-size: 4rem; }
		}
	</style>
</head>
<body>
    <a href="./index.html" aria-label="返回首页" style="position:fixed;top:12px;right:12px;z-index:9999;padding:9px 14px;border-radius:999px;background:#426b50;color:#fff;text-decoration:none;font:14px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.18)">← 返回首页</a>
	<main class="scene">
		<header class="masthead">
			<span class="brand">VIEWPORT STUDY <span>/ 03</span></span>
			<span class="edition">CSS MEDIA QUERY</span>
		</header>

		<section class="composition">
			<div class="copy">
				<p class="eyebrow">响应式练习 · 03</p>
				<h1>视口改变，<br>色彩回应。</h1>
				<p class="description">同一块全屏画布，随着屏幕尺寸切换色彩与文字尺度。</p>
				<div class="credit"><span>DESIGNED BY</span><strong>滕菲</strong></div>
			</div>

			<div class="specimen" aria-hidden="true">
				<div class="specimen-inner">
					<span class="specimen-value">100</span>
					<span class="specimen-unit">vh</span>
				</div>
				<span class="specimen-label">FULL VIEWPORT / COLOR STUDY</span>
			</div>
		</section>

		<footer class="footer">
			<span>SCREEN / COLOR / TYPE</span>
			<span>10 — 03</span>
		</footer>
	</main>
</body>
</html>
