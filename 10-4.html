<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-4 响应式布局</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #778dcb;
      --card-bg: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.8);
      --shadow: rgba(15, 23, 42, 0.35);
      --box-size: 1.6rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      min-width: 20rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      padding: 1.25rem;
    }

    .wrap {
      width: min(68rem, 100%);
      padding: 1.5rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 1.25rem 3rem var(--shadow);
      backdrop-filter: blur(8px);
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: clamp(1.5rem, 2vw + 0.8rem, 3rem);
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .item {
      flex: 1 1 12rem;
      min-height: 10rem;
      padding: 1rem;
      border-radius: 1.1rem;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0.75rem 1.5rem rgba(0,0,0,0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);
      pointer-events: none;
    }

    .item:hover {
      transform: translateY(-0.35rem);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1rem 2rem rgba(0,0,0,0.2);
    }

    .box {
      width: var(--box-size);
      height: var(--box-size);
      background: linear-gradient(135deg, #c6a3b6, #60a5fa);
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite alternate;
      box-shadow: 0 0.5rem 1rem rgba(96, 165, 250, 0.35);
    }

    .item h2 {
      font-size: 1.2rem;
      margin-bottom: 0.45rem;
      position: relative;
      z-index: 1;
    }

    .item p {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .name {
      margin-top: 1.25rem;
      text-align: center;
      font-size: clamp(1.05rem, 0.8vw + 0.8rem, 1.6rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        opacity: 0.8;
      }
      to {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    @media (min-width: 320px) {
      .item {
        flex-basis: calc(50% - 0.5rem);
      }
    }

    @media (min-width: 640px) {
      .item {
        flex-basis: calc(33.333% - 0.7rem);
      }
    }

    @media (min-width: 980px) {
      .item {
        flex-basis: calc(25% - 0.8rem);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>MEDIA QUERY</h1>
      <p>视口变化时，布局随之调整</p>
    </div>

    <div class="grid">
      <div class="item">
        <div class="box"></div>
        <h2>版块一</h2>
        <p>响应式布局，适配不同屏幕尺寸。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块二</h2>
        <p>灵活分布，舒适阅读体验。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块三</h2>
        <p>交互细节增强视觉层次。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块四</h2>
        <p>多端显示，自适应更稳定。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块五</h2>
        <p>色彩过渡更自然和柔和。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块六</h2>
        <p>适配移动端和桌面端。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块七</h2>
        <p>信息分组清晰更容易浏览。</p>
      </div>
      <div class="item">
        <div class="box"></div>
        <h2>版块八</h2>
        <p>整体视觉更高级和统一。</p>
      </div>
    </div>

    <div class="name">滕菲</div>
  </div>
</body>
</html>
