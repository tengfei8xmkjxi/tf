<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>滕菲：JavaScript</h2>
    <script>
        //输出，滕菲，你好，document，alert，console三种方式
        document.write("滕菲，你好");
        alert("滕菲，你好");
        console.log("滕菲，你好");
        //confirm和prompt
        confirm("确认吗？");
        prompt("请输入你的姓名");
        
    </script>
</body>
</html>
