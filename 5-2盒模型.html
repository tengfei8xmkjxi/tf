<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model   </title>
    <style>
        .a{
            width: 500px;
            height: 300px;
            margin: 40px auto;
            padding: 70px 60px 50px 40px;
            border: 2px dotted #039;
            /* 上下、左右、左右margin为auto则盒子居中 */
        }

        .b{
            width: 500px;
            height: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 2px dashed blue;
            /* 上、左右、下 */
        }
        .c{
            width: 500px;
            height: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid blue;
            
        }


    </style>
</head>
<body>
    <div class="a">528滕菲</div>
    <div class="b">528滕菲</div>
    <div class="c">528滕菲</div>
</body>
</html>
