<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
    }
    h2{
        text-align: center;   
        margin: 20px 0;     
    }
    .flex{ 
        display: flex;
        flex-direction: row;
        justify-content: space-around;
    }
    .flex li{ 
        width: 20%;
        height: 300px;
        border: 1px solid #333;
        list-style: none;
        display: flex;
        padding: 10px;
        box-sizing: border-box;
    }
    .box{ 
        background-color: rgb(207, 60, 192);
        width: 100%;
        height: 100%;
    }

    /* 第一个 */
    .flex li:nth-child(1){ 
        background-color: rgb(200, 210, 58);
        align-items: center;
        justify-content: center;
    }
    .flex li:nth-child(1) .box{
        width: 40%;
        height: 30%;
    }

    /* 第二个 */
    .flex li:nth-child(2){
        background-color: rgb(200, 210, 58);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .flex li:nth-child(2) .box{
        width: 45%;
        height: 30%;
    }

    /* 第三个： */
    .flex li:nth-child(3){
        background-color: rgb(200, 210, 58);
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 10px;
    }
    .flex li:nth-child(3) .box{
        width: 40%;
        height: 30%;
    }

    /* 第四个： */
    .flex li:nth-child(4){
        background-color: rgb(200, 210, 58);
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 10px;
    }
    .flex li:nth-child(4) .box:nth-child(1){
        width: 88%;
        height: 30%;
    }
    .flex li:nth-child(4) .box:nth-child(2),
    .flex li:nth-child(4) .box:nth-child(3){
        width: 42%;
        height: 30%;
    }
    </style>
</head>
<body>
    <h2>滕菲的flex</h2>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>

        <li>
            <div class="box"></div>
            <div class="box"></div>
        </li>

        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>

        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
    </ul>
</body>
</html>
