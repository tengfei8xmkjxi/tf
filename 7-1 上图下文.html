<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* 全局css */
       *{ margin: 0 ;padding: 0;} 
       ul{list-style: none;}
       img{
            display: block;
       }
       .slist{
            display: flex;
            margin:8px;
       }
       .slist li{
            width: 30%;
            margin-right: 3px;
            flex-grow: 1;
      }
       .slist  img{
            width: 100%;
      }
      .slist p{
            text-align: center;
            font-size: 14px;
            line-height: 24px;
            /* 绝对定位 */
            position:absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0,0,0,0.5);
            color: #fff;
            /* 加粗 */
            font-weight: bold;
      }
    </style>
</head>
<body>
