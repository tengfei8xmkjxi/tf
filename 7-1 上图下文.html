<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* 全局css */
       *{ margin: 0 ;padding: 0;} 
       ul{list-style: none;}
       img{
            display: block;
       }
       .slist{
            display: flex;
            margin:8px;
       }
       .slist li{
            width: 30%;
            margin-right: 3px;
            flex-grow: 1;
      }
       .slist  img{
            width: 100%;
      }
      .slist p{
            text-align: center;
            font-size: 14px;
            line-height: 24px;
            /* 图片下方配文字：不用定位，跟在图片后面按文档流排 */
            color: #333;
            margin-top: 6px;
            /* 加粗 */
            font-weight: bold;
      }
    </style>
</head>
<body>
    <ul class="slist">
        <li>
            <img src="./img/0a61ea8caeedc5f9806c1c2f143f0152.jpg" alt="示例图片1">
            <p>滕菲的标题</p>
        </li>

        <li>
            <img src="./img/0a61ea8caeedc5f9806c1c2f143f0152.jpg" alt="示例图片2">
            <p>滕菲的标题</p>
        </li>

        <li>
            <img src="./img/0a61ea8caeedc5f9806c1c2f143f0152.jpg" alt="示例图片3">
            <p>滕菲的标题</p>
        </li>
    </ul>
</body>
</html>
