<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        .list{
            list-style: none;
            padding: 10px;
        }
        .list li{
            display: flex;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }
        .list img{
            width: 120px;
            
        }
        .text{
            margin-left: 10px;
            font-size: 12px;
            color:#999;
            flex-grow: 1;
        }
        .text h3{
            width: 100%;
            font-size: 16px;
            color:#333;
            line-height: 30px;
        }
        .text p{
            line-height: 20px;
        }
    </style>
</head>
<body>
    <ul class="list">
        <li>
            <img src="./img/1.jpg" alt="">
            <div class="text">
                <h3>滕菲的标题1</h3>
                <p>这是第一段说明文字，描述图片内容和相关信息。通常用于展示模块介绍、产品特点或文章摘要。</p>
            </div>
        </li>
        <li>
            <img src="./img/2.jpg" alt="">
            <div class="text">
                <h3>滕菲的标题2</h3>
                <p>这是第二段说明文字，内容相对简洁，重点突出展示内容和结构。适合在网页中做信息列表布局。</p>
            </div>
        </li>
        <li>
            <img src="./img/553b457e3aec03dcaa18cfd0cdebbe0e.jpg" alt="">
            <div class="text">
                <h3>滕菲的标题3</h3>
                <p>这是第三段说明文字，配合三张图片形成统一的左右文字布局，让页面视觉更协调，信息更清晰。</p>
            </div>
        </li>
    </ul>
</body>
</html>
